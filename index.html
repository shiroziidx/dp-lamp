<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>DP Lamp Manager</title><style>

</style><header><div><small>DOUBLE PLAY / OFFLINE</small><h1>DP LAMP MANAGER</h1></div><button id="settings">⚙</button></header><div id="status">読み込み中…</div><section id="scores"><div class="row"><button id="import" style="flex:1;background:#245e94">↻ スコアデータ更新</button></div><div class="panel"><input id="search" placeholder="楽曲名を検索" type="search"><div class="row"><select id="sort"><option value="n">曲名順</option><option value="v">バージョン順</option><option value="l">本家難易度順</option><option value="c">クリアランプ順</option><option value="normal">非公式 ノマゲ順</option><option value="hard">非公式 ハード順</option></select><button id="reverse">↑</button></div><div class="row"><select id="level"><option value="">全LEVEL</option></select><select id="lamp"><option value="">全ランプ</option></select></div><div class="row"><select id="version"><option value="">全VERSION</option></select><select id="chart"><option value="">全譜面</option></select></div></div><div id="count" class="muted"></div><div id="list"></div></section><section id="history" hidden><div class="row"><button id="prev">‹</button><h2 id="month" style="text-align:center"></h2><button id="next">›</button></div><div id="calendar" class="cal"></div><h2 id="day"></h2><div id="changes"></div></section><nav><button data-tab="list" class="active"><span>☷</span>楽曲一覧</button><button data-tab="table"><span>▦</span>難易度表</button><button data-tab="history"><span>▣</span>更新履歴</button></nav><dialog id="modal"><h2>スコアデータ更新</h2><p>① 公式サイトでDPを選び「表示する」を押す</p><a id="official" class="action" style="display:block" target="_blank" rel="noopener" href="https://p.eagate.573.jp/game/2dx/34/djdata/score_download.html">公式CSVページを開く ↗</a><p>② CSVテキストを全選択・コピーして貼り付ける</p><textarea id="paste" placeholder="ここにCSVテキストを貼り付け" autocorrect="off" spellcheck="false"></textarea><details><summary>CSVファイルから読み込む</summary><input id="file" type="file" accept=".csv,text/csv,text/plain"></details><p class="muted">③ 取り込むと端末に保存し、前回との差分を記録します。</p><div class="row"><button id="apply">取り込む</button><button onclick="modal.close()">閉じる</button></div></dialog><dialog id="config"><h2>設定・バックアップ</h2><p class="muted">非公式難易度CSV：タイトル,譜面,ノマゲ,ハード（譜面は ANOTHER または A 等）</p><input id="diffFile" type="file" accept=".csv,text/csv"><p><button id="backup">バックアップを保存</button></p><label>バックアップ復元<input id="restore" type="file" accept=".json"></label><p><a href="https://zasa.sakura.ne.jp/dp/" target="_blank">非公式ノマゲ難易度表</a></p><label>公式CSVページURL<input id="url" type="url"></label><p class="muted">iPhoneのストレージ消去などでデータが失われる場合があります。定期的にバックアップしてください。</p><button onclick="config.close()">閉じる</button></dialog><dialog id="detail"><div id="detailBody"></div><button onclick="detail.close()">閉じる</button></dialog><script src="seed.js"></script><script src="app.js"></script></html>
